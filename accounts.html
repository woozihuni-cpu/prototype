<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - Elanne Resort Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Verdana, Geneva, sans-serif;
            background-color: #f7f3ec;
            color: #4c3e35;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #2e6180 0%, #4c3e35 100%);
            padding: 1.5rem 0;
            z-index: 1000;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 0 1.5rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1rem;
        }

        .sidebar-header h2 {
            color: white;
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }

        .sidebar-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 0.3rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .nav-link i {
            font-size: 1.2rem;
            width: 24px;
        }

        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-link.active {
            background-color: #e47b48;
            color: white;
        }

        .logout-section {
            position: absolute;
            bottom: 1.5rem;
            width: 100%;
            padding: 0 1.5rem;
        }

        .logout-btn {
            width: 100%;
            padding: 0.9rem;
            background-color: rgba(228, 123, 72, 0.2);
            color: white;
            border: 2px solid rgba(228, 123, 72, 0.5);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: Verdana, Geneva, sans-serif;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .logout-btn:hover {
            background-color: #e47b48;
            border-color: #e47b48;
        }

        .main-content {
            margin-left: 260px;
            padding: 2rem;
            min-height: 100vh;
        }

        .page-header {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            color: #2e6180;
            font-size: 1.8rem;
        }

        .add-btn {
            padding: 0.8rem 1.5rem;
            background-color: #e47b48;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: Verdana, Geneva, sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .add-btn:hover {
            background-color: #dd5a68;
            transform: translateY(-2px);
        }

        .tabs-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tab-btn {
            padding: 1rem 2rem;
            background: white;
            border: 2px solid #e0dbd0;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-family: Verdana, Geneva, sans-serif;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            color: #4c3e35;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #2e6180, #4c3e35);
            color: white;
            border-color: #2e6180;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-bar {
            background: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 1rem;
        }

        .search-input {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid #e0dbd0;
            border-radius: 6px;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 0.95rem;
        }

        .search-input:focus {
            outline: none;
            border-color: #2e6180;
        }

        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #2e6180, #4c3e35);
            color: white;
        }

        thead th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
        }

        tbody tr {
            border-bottom: 1px solid #e0dbd0;
            transition: background-color 0.3s;
        }

        tbody tr:hover {
            background-color: #f9f9f9;
        }

        tbody td {
            padding: 1rem;
            font-size: 0.9rem;
        }

        .role-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .role-badge.admin {
            background-color: #e8f5e9;
            color: #4caf50;
        }

        .role-badge.staff {
            background-color: #e3f2fd;
            color: #2196f3;
        }

        .role-badge.receptionist {
            background-color: #e8f5e9;
            color: #4caf50;
        }

        .role-badge.maintenance {
            background-color: #e8f5e9;
            color: #4caf50;
        }

        .role-badge.customer {
            background-color: #fff3e0;
            color: #ff9800;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            padding: 0.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-icon.edit {
            background-color: #e3f2fd;
            color: #2196f3;
        }

        .btn-icon.delete {
            background-color: #ffebee;
            color: #f44336;
        }

        .btn-icon:hover {
            transform: scale(1.1);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #f7f3ec;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            background: linear-gradient(135deg, #2e6180, #4c3e35);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4c3e35;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e0dbd0;
            border-radius: 6px;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 0.95rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2e6180;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .btn-submit {
            padding: 0.8rem 2rem;
            background-color: #e47b48;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: Verdana, Geneva, sans-serif;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background-color: #dd5a68;
        }

        .btn-cancel {
            padding: 0.8rem 2rem;
            background-color: #e0dbd0;
            color: #4c3e35;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: Verdana, Geneva, sans-serif;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background-color: #d0cbc0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
            }

            table {
                font-size: 0.8rem;
            }

            thead th,
            tbody td {
                padding: 0.7rem 0.5rem;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Elanne Resort</h2>
            <p>Admin Portal</p>
        </div>

        <nav>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <i class="bi bi-speedometer2"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="reservations.html" class="nav-link">
                        <i class="bi bi-calendar-check"></i>
                        <span>Reservations</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="checkin.html" class="nav-link">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span>Check-in</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="checkout.html" class="nav-link">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Checkout</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="cancellation.html" class="nav-link">
                        <i class="bi bi-x-circle"></i>
                        <span>Cancellations</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="rebooking.html" class="nav-link">
                        <i class="bi bi-arrow-repeat"></i>
                        <span>Rebookings</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="admin-rooms.html" class="nav-link">
                        <i class="bi bi-door-open"></i>
                        <span>Rooms</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="admin-packages.html" class="nav-link">
                        <i class="bi bi-box-seam"></i>
                        <span>Packages</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="payment.html" class="nav-link">
                        <i class="bi bi-credit-card"></i>
                        <span>Payments</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="guest.html" class="nav-link">
                        <i class="bi bi-person"></i>
                        <span>Guests</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="accounts.html" class="nav-link active">
                        <i class="bi bi-people"></i>
                        <span>Accounts</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="logout-section">
            <button class="logout-btn" onclick="logout()">
                <i class="bi bi-box-arrow-left"></i>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <main class="main-content">
    <div class="page-header">
        <h1><i class="bi bi-people"></i> Staff Accounts Management</h1>
        <button class="add-btn" onclick="openAddModal()">
            <i class="bi bi-plus-circle"></i> Add Staff Account
        </button>
    </div>

    <!-- Staff Table -->
    <div id="staffTab" class="tab-content active">
        <div class="search-bar">
            <input type="text" class="search-input" id="staffSearch"
                placeholder="Search staff by name, email, or role..." oninput="filterStaff()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="staffTableBody"></tbody>
            </table>
        </div>
    </div>
</main>

<!-- Add/Edit Modal -->
<div id="accountModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Add New Staff Account</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="accountForm">
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" required>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="phone" required>
                </div>

                <div class="form-group">
                    <label>Role *</label>
                    <select id="role" required>
                        <option value="">Select Role</option>
                        <option value="Admin">Admin</option>
                        <option value="Staff">Staff</option>
                        <option value="Receptionist">Receptionist</option>
                        <option value="Maintenance">Maintenance</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Status *</label>
                    <select id="status" required>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Save Account</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    if (!sessionStorage.getItem('adminLoggedIn')) {
        window.location.href = 'login.html';
    }

    let staffAccounts = [
        { id: 1, name: 'Admin User', email: 'admin@elanneresort.com', role: 'Admin', phone: '0917-111-1111', status: 'Active' },
        { id: 2, name: 'Maria Santos', email: 'maria@elanneresort.com', role: 'Receptionist', phone: '0918-222-2222', status: 'Active' },
        { id: 3, name: 'Juan Cruz', email: 'juan@elanneresort.com', role: 'Staff', phone: '0919-333-3333', status: 'Active' },
        { id: 4, name: 'Pedro Reyes', email: 'pedro@elanneresort.com', role: 'Maintenance', phone: '0920-444-4444', status: 'Active' },
        { id: 5, name: 'Ana Garcia', email: 'ana@elanneresort.com', role: 'Staff', phone: '0921-555-5555', status: 'Inactive' }
    ];

    function renderStaff(data = staffAccounts) {
        const tbody = document.getElementById('staffTableBody');
        tbody.innerHTML = '';

        data.forEach(staff => {
            const row = `
                <tr>
                    <td>#${staff.id}</td>
                    <td>${staff.name}</td>
                    <td>${staff.email}</td>
                    <td><span class="role-badge ${staff.role.toLowerCase()}">${staff.role}</span></td>
                    <td>${staff.phone}</td>
                    <td>${staff.status}</td>
                    <td class="action-btns">
                        <button class="btn-icon edit" onclick="editStaff(${staff.id})" title="Edit">
                            <i class="bi bi-pencil-fill"></i>
                        </button>
                        <button class="btn-icon delete" onclick="deleteStaff(${staff.id})" title="Delete">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function filterStaff() {
        const search = document.getElementById('staffSearch').value.toLowerCase();
        const filtered = staffAccounts.filter(staff =>
            staff.name.toLowerCase().includes(search) ||
            staff.email.toLowerCase().includes(search) ||
            staff.role.toLowerCase().includes(search)
        );
        renderStaff(filtered);
    }

    function openAddModal() {
        document.getElementById('modalTitle').textContent = 'Add Staff Account';
        document.getElementById('accountForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('accountModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('accountModal').classList.remove('show');
    }

    function editStaff(id) {
        const staff = staffAccounts.find(s => s.id === id);
        if (!staff) return;

        document.getElementById('modalTitle').textContent = 'Edit Staff Account';
        document.getElementById('editId').value = staff.id;
        document.getElementById('fullName').value = staff.name;
        document.getElementById('email').value = staff.email;
        document.getElementById('phone').value = staff.phone;
        document.getElementById('role').value = staff.role;
        document.getElementById('status').value = staff.status;
        document.getElementById('accountModal').classList.add('show');
    }

    function deleteStaff(id) {
        if (confirm('Are you sure you want to delete this staff account?')) {
            staffAccounts = staffAccounts.filter(s => s.id !== id);
            renderStaff();
            alert('Staff account deleted successfully!');
        }
    }

    document.getElementById('accountForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const editId = document.getElementById('editId').value;
        const formData = {
            name: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            role: document.getElementById('role').value,
            status: document.getElementById('status').value
        };

        if (editId) {
            const index = staffAccounts.findIndex(s => s.id === parseInt(editId));
            if (index !== -1) {
                staffAccounts[index] = { ...staffAccounts[index], ...formData };
                alert('Staff account updated successfully!');
            }
        } else {
            const newId = Math.max(...staffAccounts.map(s => s.id)) + 1;
            staffAccounts.push({ id: newId, ...formData });
            alert('Staff account added successfully!');
        }

        renderStaff();
        closeModal();
    });

    function logout() {
        if (confirm('Are you sure you want to logout?')) {
            sessionStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        }
    }

    renderStaff();
</script>
</body>
</html>

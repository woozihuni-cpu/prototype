<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Elanne Resort Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Verdana, Geneva, sans-serif;
            background: linear-gradient(135deg, #2e6180 0%, #4c3e35 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .signup-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 550px;
            overflow: hidden;
        }

        .signup-header {
            background: linear-gradient(135deg, #2e6180 0%, #4c3e35 100%);
            padding: 2.5rem 2rem;
            text-align: center;
            color: white;
        }

        .logo-container {
            margin-bottom: 1.5rem;
        }

        .logo-container img {
            max-width: 180px;
            height: auto;
            border-radius: 8px;
        }

        .signup-header i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .signup-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .signup-header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .signup-body {
            padding: 2.5rem 2rem;
            max-height: 70vh;
            overflow-y: auto;
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .alert.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section h3 {
            color: #2e6180;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e0dbd0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4c3e35;
            font-size: 0.9rem;
        }

        .form-group label .required {
            color: #e47b48;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 1rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 3rem;
            border: 2px solid #e0dbd0;
            border-radius: 6px;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2e6180;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            font-size: 1rem;
        }

        .password-toggle:hover {
            color: #2e6180;
        }

        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: #e0dbd0;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: #f44336;
        }

        .password-strength-bar.medium {
            width: 66%;
            background: #ff9800;
        }

        .password-strength-bar.strong {
            width: 100%;
            background: #4caf50;
        }

        .password-hint {
            font-size: 0.75rem;
            color: #777;
            margin-top: 0.3rem;
        }

        .signup-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #e47b48 0%, #dd5a68 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            font-family: Verdana, Geneva, sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .signup-btn:hover {
            background: linear-gradient(135deg, #dd5a68 0%, #e47b48 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(228, 123, 72, 0.3);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        .signup-footer {
            text-align: center;
            padding: 1.5rem 2rem 2rem;
            border-top: 1px solid #e0dbd0;
        }

        .signup-footer p {
            color: #777;
            font-size: 0.9rem;
        }

        .signup-footer a {
            color: #2e6180;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-footer a:hover {
            color: #e47b48;
        }

        @media (max-width: 600px) {
            .signup-container {
                margin: 1rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .signup-header {
                padding: 2rem 1.5rem;
            }

            .signup-body {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <div class="logo-container">
                <!-- Replace 'logo.png' with your actual logo file path -->
                <img src="admin logo.png" alt="Elanne Resort Logo">
            </div>
            <h1>Create Account</h1>
            <p>Welcome! Please enter the details below</p>
        </div>

        <div class="signup-body">
            <div id="alertBox" class="alert"></div>

            <form id="signupForm">
                <!-- Personal Details Section -->
                <div class="form-section">
                    <h3><i class="bi bi-person"></i> Personal Details</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <i class="bi bi-person"></i>
                                <input type="text" id="firstName" placeholder="Juan" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last Name <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <i class="bi bi-person"></i>
                                <input type="text" id="lastName" placeholder="Dela Cruz" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope"></i>
                            <input type="email" id="email" placeholder="juan.delacruz@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="bi bi-telephone"></i>
                            <input type="tel" id="phone" placeholder="0917-123-4567" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <div class="input-wrapper">
                            <i class="bi bi-geo-alt"></i>
                            <input type="text" id="address" placeholder="City, Province">
                        </div>
                    </div>
                </div>

                <!-- Account Details Section -->
                <div class="form-section">
                    <h3><i class="bi bi-shield-lock"></i> Account Details</h3>

                    <div class="form-group">
                        <label for="role">Role <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="bi bi-briefcase"></i>
                            <select id="role" required>
                                <option value="">Select Role</option>
                                <option value="Admin">Admin</option>
                                <option value="Receptionist">Receptionist</option>
                                <option value="Maintenance Staff">Maintenance Staff</option>
                                <option value="Staff">Staff</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>
                            <input type="password" id="password" placeholder="Create a strong password" required minlength="6">
                            <i class="bi bi-eye password-toggle" id="togglePassword"></i>
                        </div>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strengthBar"></div>
                        </div>
                        <p class="password-hint">Minimum 6 characters</p>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock-fill"></i>
                            <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                            <i class="bi bi-eye password-toggle" id="toggleConfirmPassword"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="signup-btn">
                    <i class="bi bi-check-circle"></i>
                    <span>Create Account</span>
                </button>
            </form>
        </div>

        <div class="signup-footer">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('confirmPassword');
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });

        // Password strength checker
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            strengthBar.className = 'password-strength-bar';
            if (strength <= 2) {
                strengthBar.classList.add('weak');
            } else if (strength <= 4) {
                strengthBar.classList.add('medium');
            } else {
                strengthBar.classList.add('strong');
            }
        });

        // Show alert function
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get form values
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                showAlert('Passwords do not match!', 'error');
                return;
            }

            // Validate password length
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long!', 'error');
                return;
            }

            // Load existing users
            const existingUsers = JSON.parse(sessionStorage.getItem('registeredUsers') || '{}');

            // Check if email already exists
            if (existingUsers[email]) {
                showAlert('Email already registered! Please use a different email.', 'error');
                return;
            }

            // Create new user object
            const newUser = {
                password: password,
                name: `${firstName} ${lastName}`,
                role: role,
                phone: phone,
                address: address,
                createdAt: new Date().toISOString()
            };

            // Save user to storage
            existingUsers[email] = newUser;
            sessionStorage.setItem('registeredUsers', JSON.stringify(existingUsers));

            showAlert('Account created successfully! Redirecting to login...', 'success');

            // Clear form
            document.getElementById('signupForm').reset();

            // Redirect to login after 2 seconds
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });

        // Check if already logged in
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
